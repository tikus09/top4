# Runs automatically on every pull request into main.
# If a step fails, the PR shows a red X so we know not to merge yet.
name: Checks

on:
  pull_request:
    branches: [main]
  # Also allows running it by hand from the "Actions" tab on GitHub.
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# If you push again to the same PR, cancel the older run that is still going.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Type check and build
    # A fresh Linux machine from GitHub, thrown away after the run.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Download the PR's code onto the machine.
      - name: Check out code
        uses: actions/checkout@v6

      # 2. Install Node.js (version from .nvmrc), with a cache for npm downloads.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # 3. Install the exact library versions from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # 4. Type check .astro files (astro check) and .svelte files (svelte-check).
      - name: Type check
        run: npm run check

      # 5. Build the Worker, exactly like a deploy would.
      - name: Build
        run: npm run build
